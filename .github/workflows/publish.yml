name: publish

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Version to publish for both packages (for example, 0.0.1)'
        required: false
        default: ''
        type: string
      npm-tag:
        description: 'npm dist-tag to use'
        required: false
        default: latest
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set npm tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.npm-tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve publish version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release-version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "No version provided. Pass release-version in workflow_dispatch or push a tag like v0.0.1."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check workspace and packed artifacts
        run: bun run check

      - name: Set package versions
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          for package in packages/typespun packages/codegen; do
            (cd "$package" && npm version --no-git-tag-version --allow-same-version "$VERSION")
          done

      - name: Prepare package manifests for publish
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          (cd packages/codegen && npm pkg set dependencies.typespun="^$VERSION")

      - name: Prepare package archives
        run: mkdir -p .release

      - name: Pack typespun
        working-directory: packages/typespun
        run: bun pm pack --filename ../../.release/typespun.tgz --ignore-scripts

      - name: Pack typespun-codegen
        working-directory: packages/codegen
        run: bun pm pack --filename ../../.release/typespun-codegen.tgz --ignore-scripts

      - name: Publish typespun
        run: |
          npm whoami
          npm publish .release/typespun.tgz --access public --tag "${{ steps.tag.outputs.tag }}"

      - name: Publish typespun-codegen
        run: npm publish .release/typespun-codegen.tgz --access public --tag "${{ steps.tag.outputs.tag }}"
