<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TypeSpun Playground</title>
    <meta
      name="description"
      content="Edit one TypeScript interface and watch TypeSpun generate a typed, validated config loader — in the browser, with no server."
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // `typespun/generated` touches `process.env` on exactly one branch (when
      // `loadConfig` is called without an explicit `source`). The playground
      // always passes a source, but an ambient `process` keeps that reference
      // from being a ReferenceError in a browser.
      globalThis.process = globalThis.process || { env: {} };

      // Theme must be applied before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('typespun-playground-theme');
        var theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
